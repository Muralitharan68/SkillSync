<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | SkillSync</title>

    <link rel="stylesheet" href="profile.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <h2>SkillSync</h2>

            <ul>

                <li><i class="fa-solid fa-house"></i> Dashboard</li>

                <li class="active">
                    <i class="fa-solid fa-user"></i> Profile
                </li>

                <li><i class="fa-solid fa-code"></i> My Skills</li>

                <li><i class="fa-solid fa-magnifying-glass"></i> Find Skills</li>

                <li><i class="fa-solid fa-handshake"></i> Matches</li>

                <li><i class="fa-solid fa-comments"></i> Chat</li>

                <li><i class="fa-solid fa-calendar"></i> Sessions</li>

                <li><i class="fa-solid fa-star"></i> Reviews</li>

                <li><i class="fa-solid fa-bell"></i> Notifications</li>

                <li><i class="fa-solid fa-gear"></i> Settings</li>

                <li><i class="fa-solid fa-right-from-bracket"></i> Logout</li>

            </ul>

        </aside>

        <!-- Main -->

        <main class="content">

            <div class="header">

                <h1>My Profile</h1>

                <button id="editBtn">Edit Profile</button>

            </div>

            <div class="profile-card">

                <!-- Profile Top -->

                <div class="profile-top">

                    <img src="profile.png" alt="Profile">

                    <div>

                        <h2 id="nameText">Loading...</h2>

                        <p>SkillSync User</p>

                        <span>📍 Tamil Nadu</span>

                    </div>

                </div>

                <!-- Profile Info -->

                <div class="profile-info">

                    <div>

                        <label>Name</label>

                        <input
                            type="text"
                            id="name"
                            disabled>

                    </div>

                    <div>

                        <label>Email</label>

                        <input
                            type="email"
                            id="email"
                            disabled>

                    </div>

                    <div>

                        <label>College</label>

                        <input
                            type="text"
                            id="college"
                            disabled>

                    </div>

                    <div>

                        <label>Department</label>

                        <input
                            type="text"
                            id="department"
                            disabled>

                    </div>

                </div>

                <!-- About -->

                <div class="bio">

                    <h3>About Me</h3>

                    <textarea
                        id="about"
                        disabled></textarea>

                </div>

                <!-- Skills -->

                <div class="skills">

                    <h3>Skills</h3>

                    <span>HTML</span>

                    <span>CSS</span>

                    <span>JavaScript</span>

                    <span>Python</span>

                    <span>React</span>

                </div>

                <button id="saveBtn">
                    Save Changes
                </button>

            </div>

        </main>

    </div>

    <script src="profile.js"></script>

</body>

</html>
