<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Skills</title>

<link rel="stylesheet" href="myskill.css">

<link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>


<body>


<div class="container">


<!-- Sidebar -->

<div class="sidebar">


<h2>SkillSync</h2>


<ul>

<li>
<i class="fa fa-home"></i>
Dashboard
</li>


<li>
<i class="fa fa-user"></i>
Profile
</li>


<li class="active">
<i class="fa fa-code"></i>
My Skills
</li>


<li>
<i class="fa fa-search"></i>
Find Skills
</li>


<li>
<i class="fa fa-comments"></i>
Chat
</li>


<li>
<i class="fa fa-calendar"></i>
Sessions
</li>


<li>
<i class="fa fa-star"></i>
Reviews
</li>


<li>
<i class="fa fa-bell"></i>
Notifications
</li>


<li>
<i class="fa fa-gear"></i>
Settings
</li>


</ul>


</div>





<!-- Main Content -->


<div class="main">



<!-- Top Bar -->

<div class="topbar">


<h1>My Skills</h1>



<div class="profile-mini">


<img src="profile.jpg">


<div>

<h4>Ruban Kumar</h4>

<p>Student</p>


</div>


</div>


</div>





<!-- Skills Container -->


<div class="skills-box">


<div class="box-header">


<h2>Skills I Can Teach</h2>


<button id="editBtn">

<i class="fa fa-pen"></i>
Edit Skills

</button>


</div>





<div id="skillList">



<!-- Javascript la cards varum -->


</div>

</div>





</div>


</div>







<!-- Edit Modal -->


<div class="modal" id="editModal">


<div class="modal-content">


<h2>Edit Skills</h2>



<div class="input-box">

<label>Skill 1</label>

<input id="skill1Name">

<input id="skill1Percent" type="number" placeholder="Percentage">


</div>




<div class="input-box">

<label>Skill 2</label>

<input id="skill2Name">

<input id="skill2Percent" type="number" placeholder="Percentage">


</div>





<div class="input-box">

<label>Skill 3</label>

<input id="skill3Name">

<input id="skill3Percent" type="number" placeholder="Percentage">


</div>





<div class="input-box">

<label>Skill 4</label>

<input id="skill4Name">

<input id="skill4Percent" type="number" placeholder="Percentage">


</div>





<button id="updateBtn">
Update
</button>


<button id="closeBtn">
Cancel
</button>




</div>


</div>





<script src="myskills.js"></script>


</body>

</html>
